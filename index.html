
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowKeep</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Base Resilient Styles for Offline Booting */
        :root {
            --accent: #ffffff;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #fafafa;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
        }
        #root {
            height: 100vh;
            display: flex;
            background-color: #000;
        }
        /* Fallback Layout if Tailwind fails */
        nav { 
            min-width: 80px; 
            background: #000;
            border-right: 1px solid #18181b;
        }
        @media (min-width: 768px) { nav { min-width: 256px; } }
        main { 
            flex: 1; 
            overflow-y: auto; 
            background: #000;
        }

        #boot-loader {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 0.5s ease;
        }
        .logo-box {
            width: 40px;
            height: 40px;
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .logo-inner { width: 12px; height: 12px; background: white; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.8); } }
        .boot-text { font-size: 10px; font-weight: 900; letter-spacing: 0.5em; text-transform: uppercase; color: #444; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "date-fns": "https://esm.sh/date-fns@^4.1.0",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-black text-white selection:bg-white selection:text-black">
    <div id="boot-loader">
        <div class="logo-box"><div class="logo-inner"></div></div>
        <div class="boot-text">ShadowKeep Booting...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
    <script>
        window.addEventListener('load', () => {
            const loader = document.getElementById('boot-loader');
            // Ensure loader is removed even if React crashes or JS has errors
            setTimeout(() => { 
                if(loader) {
                    loader.style.opacity = '0'; 
                    setTimeout(() => loader.remove(), 500); 
                }
            }, 800);
        });
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
